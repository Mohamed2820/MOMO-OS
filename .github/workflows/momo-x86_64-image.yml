name: MOMO OS — x86_64 bootable image

on:
  workflow_dispatch:
  push:
    branches:
      - "bootable/**"
    paths:
      - "board/momo/**"
      - "docs/BOOTABLE_IMAGE.md"
      - ".github/workflows/momo-x86_64-image.yml"

permissions:
  contents: read

concurrency:
  group: momo-x86_64-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out MOMO OS
        uses: actions/checkout@v4

      - name: Install host build and emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc cpio file libncurses-dev             python3 rsync unzip wget qemu-system-x86 qemu-utils

      - name: Download and verify pinned Buildroot release
        shell: bash
        run: |
          set -euo pipefail
          version="2026.08.1"
          archive="buildroot-${version}.tar.xz"
          base="https://buildroot.org/downloads"
          wget --https-only "${base}/${archive}"
          wget --https-only "${base}/${archive}.sha256"
          sha256sum -c "${archive}.sha256"
          tar -xf "${archive}"
          echo "BUILDROOT_DIR=${GITHUB_WORKSPACE}/buildroot-${version}" >> "$GITHUB_ENV"

      - name: Configure Buildroot with MOMO overlay
        shell: bash
        run: |
          set -euo pipefail
          chmod +x board/momo/rootfs-overlay/etc/init.d/S99momo
          chmod +x board/momo/rootfs-overlay/usr/bin/momoctl
          make -C "$BUILDROOT_DIR" qemu_x86_64_defconfig
          sed -i '/^BR2_ROOTFS_OVERLAY=/d' "$BUILDROOT_DIR/.config"
          printf 'BR2_ROOTFS_OVERLAY="%s/board/momo/rootfs-overlay"\n' "$GITHUB_WORKSPACE" >> "$BUILDROOT_DIR/.config"
          make -C "$BUILDROOT_DIR" olddefconfig

      - name: Build Linux kernel and MOMO root filesystem
        run: |
          make -C "$BUILDROOT_DIR" -j"$(nproc)"

      - name: Verify image outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BUILDROOT_DIR/output/images/bzImage"
          test -s "$BUILDROOT_DIR/output/images/rootfs.ext2"
          file "$BUILDROOT_DIR/output/images/bzImage"
          file "$BUILDROOT_DIR/output/images/rootfs.ext2"
          cp "$BUILDROOT_DIR/output/images/bzImage" "$GITHUB_WORKSPACE/bzImage"
          cp "$BUILDROOT_DIR/output/images/rootfs.ext2" "$GITHUB_WORKSPACE/rootfs.ext2"

      - name: Boot MOMO OS under QEMU and verify readiness
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 75s qemu-system-x86_64 -M pc -m 1024 \
            -kernel "$GITHUB_WORKSPACE/bzImage" \
            -drive "file=$GITHUB_WORKSPACE/rootfs.ext2,if=virtio,format=raw" \
            -append "rootwait root=/dev/vda console=tty1 console=ttyS0" \
            -serial stdio -net nic,model=virtio -net user -display none \
            -no-reboot 2>&1 | tee "$GITHUB_WORKSPACE/qemu-boot.log"
          qemu_status=${PIPESTATUS[0]}
          set -e
          if [[ "$qemu_status" -ne 0 && "$qemu_status" -ne 124 ]]; then
            echo "QEMU exited unexpectedly: $qemu_status"
            exit "$qemu_status"
          fi
          grep -F "MOMO OS READY" "$GITHUB_WORKSPACE/qemu-boot.log"

      - name: Record build provenance
        if: always()
        shell: bash
        run: |
          {
            echo "MOMO_COMMIT=$GITHUB_SHA"
            echo "BUILDROOT_VERSION=2026.08.1"
            echo "TARGET=qemu_x86_64"
            echo "WORKFLOW_RUN=$GITHUB_RUN_ID"
          } > build-metadata.txt

      - name: Upload bootable image and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momo-os-x86_64-${{ github.sha }}
          path: |
            bzImage
            rootfs.ext2
            qemu-boot.log
            build-metadata.txt
          if-no-files-found: warn
          retention-days: 14
