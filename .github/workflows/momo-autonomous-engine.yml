name: MOMO CELL supervised engineering worker

on:
  workflow_dispatch:
    inputs:
      task_issue_number:
        description: "Exact open GitHub Issue number labeled momo-cell:ready"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".momo-cell/dispatch.json"

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read

concurrency:
  group: momo-cell-supervised-worker
  cancel-in-progress: false

jobs:
  autonomous-cycle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve assigned task
        id: assignment
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ISSUE: ${{ inputs.task_issue_number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            TASK_ISSUE_NUMBER="$(python3 -c 'import json; print(json.load(open(".momo-cell/dispatch.json", encoding="utf-8"))["task_issue_number"])')"
          else
            TASK_ISSUE_NUMBER="$INPUT_ISSUE"
          fi
          if [[ ! "$TASK_ISSUE_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "Invalid task Issue number."
            exit 2
          fi
          echo "task_issue_number=$TASK_ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create isolated task branch
        id: task-branch
        env:
          TASK_ISSUE_NUMBER: ${{ steps.assignment.outputs.task_issue_number }}
        run: |
          set -euo pipefail
          BRANCH="momo-cell/task-${TASK_ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run one bounded MOMO CELL engineering cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.8-flash' }}
          GEMINI_API_URL: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
          MOMO_TASK_ISSUE_NUMBER: ${{ steps.assignment.outputs.task_issue_number }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m intelligence.autonomy.runner

      - name: Verify the proposed patch
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m py_compile intelligence/autonomy/runner.py intelligence/autonomy/task_assignment.py intelligence/autonomy/agent_runtime.py
          python3 -m unittest discover -s tests -p 'test_momo_*.py' -v
          git diff --check

      - name: Commit and publish the candidate branch
        env:
          BRANCH: ${{ steps.task-branch.outputs.branch }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "The worker produced no source patch; no PR will be opened."
            exit 3
          fi
          git config user.name "momo-cell[bot]"
          git config user.email "momo-cell[bot]@users.noreply.github.com"
          if [[ -f .momo-cell/memory/engineering.jsonl ]]; then git add -- .momo-cell/memory/engineering.jsonl; fi
          git diff --name-only -z | git add --pathspec-from-file=- --pathspec-file-nul
          git commit -m "feat(autonomy): apply verified MOMO CELL task patch"
          git push origin "HEAD:$BRANCH"

      - name: Open a review pull request against main
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.task-branch.outputs.branch }}
          TASK_ISSUE_NUMBER: ${{ steps.assignment.outputs.task_issue_number }}
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "MOMO CELL candidate for task #$TASK_ISSUE_NUMBER" \
            --body "Generated by the supervised MOMO CELL worker for explicitly assigned Issue #$TASK_ISSUE_NUMBER. Human review and merge are required."
