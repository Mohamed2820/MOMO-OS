name: MOMO CELL autonomous engineering cycle

on:
  push:
    branches: ["feature/momo-autonomous-engine"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: momo-autonomous-engine
  cancel-in-progress: false

jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run one bounded MOMO CELL engineering cycle
        env:
          MOMO_AGENT_API_KEY: ${{ secrets.MOMO_AGENT_API_KEY }}
          MOMO_AGENT_MODEL: ${{ vars.MOMO_AGENT_MODEL }}
          MOMO_AGENT_API_URL: ${{ vars.MOMO_AGENT_API_URL }}
        run: python3 -m intelligence.autonomy.runner
      - name: Verify patch with repository checks
        run: |
          set -euo pipefail
          python3 -m py_compile intelligence/autonomy/runner.py
          python3 -m unittest discover -s tests -v
          python3 -m intelligence.cell.cli --root . --output "$RUNNER_TEMP/momo-cell-report.json"
          git diff --check
      - name: Commit verified patch
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source patch was produced."
            exit 0
          fi
          git config user.name "momo-cell[bot]"
          git config user.email "momo-cell[bot]@users.noreply.github.com"
          git add -- intelligence tests docs platform_adapters board/momo/rootfs-overlay/usr/lib/momo board/momo/rootfs-overlay/usr/bin
          git commit -m "feat(autonomy): apply verified MOMO CELL engineering patch"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Open or update engineering pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr create \
            --base integration/execution-runtime-main \
            --head "${GITHUB_REF_NAME}" \
            --title "MOMO CELL autonomous engineering increment" \
            --body "Automated candidate from the bounded MOMO CELL engineering worker. Repository tests and deterministic health checks passed in this run. Human review and independent architecture-specific acceptance are still required." \
            || gh pr view "${GITHUB_REF_NAME}" --json url,state,title
