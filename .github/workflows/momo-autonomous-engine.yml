name: MOMO CELL supervised engineering worker

on:
  workflow_dispatch:
    inputs:
      task_issue_number:
        description: "Exact open GitHub Issue number labeled momo-cell:ready"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: momo-cell-supervised-worker
  cancel-in-progress: false

jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create isolated task branch
        id: task-branch
        env:
          TASK_ISSUE_NUMBER: ${{ inputs.task_issue_number }}
        run: |
          set -euo pipefail
          if [[ ! "$TASK_ISSUE_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "Invalid task Issue number."
            exit 2
          fi
          BRANCH="momo-cell/task-${TASK_ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run one bounded MOMO CELL engineering cycle
        env:
          MOMO_AGENT_API_KEY: ${{ secrets.MOMO_AGENT_API_KEY }}
          MOMO_AGENT_MODEL: ${{ vars.MOMO_AGENT_MODEL }}
          MOMO_AGENT_API_URL: ${{ vars.MOMO_AGENT_API_URL }}
          MOMO_TASK_ISSUE_NUMBER: ${{ inputs.task_issue_number }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 -m intelligence.autonomy.runner

      - name: Verify the proposed patch
        run: |
          set -euo pipefail
          python3 -m py_compile intelligence/autonomy/runner.py intelligence/autonomy/task_assignment.py
          python3 -m unittest -v tests.test_momo_autonomy tests.test_momo_task_assignment
          git diff --check

      - name: Commit and publish the candidate branch
        env:
          BRANCH: ${{ steps.task-branch.outputs.branch }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "The worker produced no source patch; no PR will be opened."
            exit 3
          fi
          git config user.name "momo-cell[bot]"
          git config user.email "momo-cell[bot]@users.noreply.github.com"
          git diff --name-only -z | git add --pathspec-from-file=- --pathspec-file-nul
          git commit -m "feat(autonomy): apply verified MOMO CELL task patch"
          git push origin "HEAD:$BRANCH"

      - name: Open a review pull request against main
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.task-branch.outputs.branch }}
          TASK_ISSUE_NUMBER: ${{ inputs.task_issue_number }}
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "MOMO CELL candidate for task #$TASK_ISSUE_NUMBER" \
            --body "Generated by the supervised MOMO CELL worker for explicitly assigned Issue #$TASK_ISSUE_NUMBER. The patch is bounded to the Issue file scope and validated by the fixed tests in this workflow. Human review and merge are required."
