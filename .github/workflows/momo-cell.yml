name: MOMO CELL health cycle

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "integration/**"]

permissions:
  contents: read

concurrency:
  group: momo-cell-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository snapshot
        uses: actions/checkout@v4
      - name: Run bounded MOMO CELL scan
        run: |
          python3 -m intelligence.cell.cli --root . --output momo-cell-report.json
      - name: Retain health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momo-cell-health-${{ github.run_id }}
          path: momo-cell-report.json
          if-no-files-found: error
          retention-days: 30
